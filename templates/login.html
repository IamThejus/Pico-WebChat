<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>

<body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;">

<div>
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Enter username">
    <button onclick="goToChat()">Join</button>
    <p><span id="active-users-num">0</span> users online</p>
</div>

<script>
async function loadActiveUserCount() {
    try {
        const response = await fetch("/active-users-count");
        const result = await response.json();
        document.getElementById("active-users-num").innerText =
            result.data.count;
    } catch {
        document.getElementById("active-users-num").innerText = "0";
    }
}

loadActiveUserCount();
setInterval(loadActiveUserCount, 3000);

function goToChat() {
    const username = document.getElementById("username").value.trim();
    if (!username) {
        alert("Enter username");
        return;
    }
    window.location.href = `/chat/${username}`;
}
</script>

</body>
</html>
