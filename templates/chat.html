<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chat</title>
<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 250px;
    background: #f3f4f6;
    padding: 15px;
    border-right: 1px solid #ddd;
}

.chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.chat-header {
    padding: 15px;
    background: #e5e7eb;
    border-bottom: 1px solid #ddd;
}

.messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

.input-area {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
}

.input-area input {
    flex: 1;
    padding: 10px;
}

.input-area button {
    padding: 10px 20px;
    margin-left: 5px;
}
</style>
</head>

<body>

<div class="sidebar">
    <h3>Online Users</h3>
    <div id="active-users"></div>
</div>

<div class="chat-container">
    <div class="chat-header">
        Logged in as {{ username }}
    </div>

    <div id="messages" class="messages"></div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
window.currentUser = "{{ username }}";

const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
const socket = new WebSocket(`${protocol}//${window.location.host}/ws/${window.currentUser}`);

socket.onopen = () => {
    console.log("WebSocket Connected");
};

socket.onerror = (error) => {
    console.error("WebSocket Error:", error);
};

socket.onmessage = (event) => {
    const result = JSON.parse(event.data);

    if (result.type === "error") {
        alert(result.data.log || "Username already exists");
        window.location.href = "/";
        return;
    }

    if (result.type === "active-users-list") {
        renderUsers(result.data.users);
        return;
    }

    if (result.type === "message" && result.data.type === "public") {
        const messages = document.getElementById("messages");
        messages.innerHTML += `<div><b>${result.data.sender}</b>: ${result.data.message}</div>`;
        messages.scrollTop = messages.scrollHeight;
        return;
    }
};

function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();
    if (!message) return;

    socket.send(JSON.stringify({
        type: "public",
        message: message
    }));

    input.value = "";
}

function renderUsers(users) {
    const container = document.getElementById("active-users");
    container.innerHTML = "";

    users.forEach(user => {
        if (user === window.currentUser) return;
        const div = document.createElement("div");
        div.innerText = user;
        container.appendChild(div);
    });
}
</script>

</body>
</html>
